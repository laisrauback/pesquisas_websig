<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pesquisas Acadêmicas em Arqueologia no Brasil</title>

    <!-- Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <!-- CSS do projeto -->
    <link rel="stylesheet" href="css/estilo.css">

    <!-- Bootstrap -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">
</head>

<body>

    <!-- MAPA -->
    <div id="map"></div>


    <!-- TÍTULO -->
    <div id="titulo">
        <h1>Pesquisas Acadêmicas em Arqueologia no Brasil</h1>
        <p>
            Pesquisas realizadas entre os anos de 1991 e 2025
            com autorização do IPHAN
        </p>
    </div>


    <!-- BARRA DE PESQUISA -->
    <div id="area-pesquisa">
        <input type="text" id="campo-pesquisa" placeholder="Pesquisar cidade ou pesquisa arqueológica..."
            autocomplete="off">

        <div id="resultados-pesquisa"></div>
    </div>

    <!-- ======================================== -->
    <!-- MODAL DO MUNICÍPIO -->
    <!-- ======================================== -->

    <div class="modal fade" id="modalMunicipio" tabindex="-1" aria-labelledby="modalMunicipioLabel" aria-hidden="true">

        <div class="modal-dialog modal-lg modal-dialog-centered">

            <div class="modal-content">

                <!-- Cabeçalho -->
                <div class="modal-header">

                    <h5 class="modal-title" id="modalMunicipioLabel">
                        Município
                    </h5>

                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar">
                    </button>

                </div>


                <!-- Conteúdo -->
                <div class="modal-body" id="conteudoMunicipio">

                    Carregando...

                </div>

            </div>

        </div>

    </div>


    <!-- ======================================== -->
    <!-- SCRIPTS -->
    <!-- ======================================== -->

    <!-- Leaflet -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
    </script>

    <!-- Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js">
    </script>

    <!-- JavaScript do mapa -->
    <script src="js/mapa.js"></script>

</body>

</html>
